<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Desk Chat</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#dbeafe 0,#f3f6fb 38%),#f3f6fb}
    .shell{width:min(960px,100%);margin:0 auto;padding:28px 18px 32px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:22px;box-shadow:0 8px 20px #2563eb45}.brand h1{font-size:20px;margin:0}.brand p{font-size:13px;color:#64748b;margin:3px 0 0}
    .back{color:#2563eb;text-decoration:none;font-weight:650;background:#fff;padding:10px 14px;border:1px solid #dbe4f0;border-radius:12px;transition:.2s}.back:hover{background:#eff6ff;transform:translateY(-1px)}
    .panel{overflow:hidden;border:1px solid #e3eaf3;border-radius:22px;background:#ffffffd9;box-shadow:0 18px 50px #1e3a8a14;backdrop-filter:blur(10px)}
    .settings{display:flex;align-items:end;gap:14px;padding:20px 22px;border-bottom:1px solid #edf1f6;background:#fbfdff}.field{display:flex;flex:1;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:#64748b}.field input,.field select{width:100%}.field label span{font-weight:400;color:#94a3b8}
    select,input,button{font:inherit;border:1px solid #d6dfeb;border-radius:11px;background:#fff;color:#172033;padding:11px 13px;outline:none;transition:.2s}select:focus,input:focus{border-color:#6495ed;box-shadow:0 0 0 4px #2563eb18}.messages{min-height:52vh;max-height:58vh;overflow-y:auto;padding:24px;background:linear-gradient(#fff,#fbfdff)}.messages:empty:before{content:"เริ่มต้นการสนทนากับ AI ได้เลย";display:block;text-align:center;color:#94a3b8;padding:80px 20px}
    .bubble{width:fit-content;max-width:82%;padding:13px 16px;margin:12px 0;border-radius:16px;white-space:pre-wrap;line-height:1.65;box-shadow:0 3px 10px #1720330b}.user{margin-left:auto;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-bottom-right-radius:5px}.assistant{margin-right:auto;background:#f1f5f9;color:#26344a;border-bottom-left-radius:5px}
    form{display:flex;gap:10px;padding:16px 22px;background:#fbfdff;border-top:1px solid #edf1f6}form input{flex:1;font-size:16px;padding:13px 15px}form button{border:0;color:#fff;font-weight:700;padding:0 22px;background:linear-gradient(135deg,#2563eb,#4f46e5);box-shadow:0 7px 16px #2563eb35;cursor:pointer}form button:hover{filter:brightness(1.08);transform:translateY(-1px)}form button:disabled{opacity:.55;cursor:wait;transform:none}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 22px;background:#fff;border-bottom:1px solid #edf1f6}.status{display:flex;align-items:center;gap:7px;color:#64748b;font-size:12px}.status i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #dcfce7}.clear{border:0;background:transparent;color:#64748b;font-size:12px;cursor:pointer;padding:6px 9px}.clear:hover{color:#dc2626;background:#fef2f2}.suggestions{display:flex;gap:8px;overflow-x:auto;padding:14px 22px 0}.suggestion{white-space:nowrap;border:1px solid #dbe4f0;border-radius:999px;background:#fff;color:#475569;padding:8px 12px;font-size:12px;cursor:pointer}.suggestion:hover{border-color:#93c5fd;color:#2563eb;background:#eff6ff}.hint{text-align:center;color:#94a3b8;font-size:12px;margin:13px 0 0}@media(max-width:600px){.shell{padding:18px 12px 24px}.topbar{align-items:flex-start}.brand p{display:none}.back{padding:8px 10px;font-size:13px}.settings{align-items:stretch;flex-direction:column;gap:10px;padding:15px}.toolbar{padding:10px 15px}.suggestions{padding:12px 15px 0}.messages{min-height:58vh;max-height:none;padding:16px}.bubble{max-width:90%}form{padding:12px 15px}form button{padding:0 16px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="logo">✦</div><div><h1>AI Desk Chat</h1><p>ผู้ช่วย AI สำหรับการทำงานของคุณ</p></div></div><a class="back" href="/">← กลับ Portal</a></header>
    <section class="panel">
      <div class="settings"><div class="field"><label for="provider">ผู้ให้บริการ AI</label><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></div><div class="field"><label for="model">รุ่นโมเดล <span>(ไม่ระบุ = ค่าเริ่มต้น)</span></label><input id="model" placeholder="เช่น gemini-2.0-flash"></div></div>
      <div class="toolbar"><div class="status"><i></i><span id="status">พร้อมใช้งาน</span></div><button class="clear" id="clear" type="button">ล้างการสนทนา</button></div>
      <div class="suggestions"><button class="suggestion" type="button">ช่วยวางแผนงานวันนี้</button><button class="suggestion" type="button">สรุปข้อความนี้ให้หน่อย</button><button class="suggestion" type="button">อธิบายเรื่องนี้แบบเข้าใจง่าย</button></div>
      <main id="messages" class="messages"></main>
      <form id="form"><input id="message" autocomplete="off" placeholder="พิมพ์ข้อความที่ต้องการถาม..." aria-label="ข้อความ"><button type="submit">ส่ง&nbsp; ↗</button></form>
    </section>
    <p class="hint">กดปุ่มส่งเพื่อเริ่มสนทนาอย่างสร้างสรรค์</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
